name: Build NomreNegar APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f nomrenegar-project-2.1.0.zip || {
            echo 'Missing nomrenegar-project-2.1.0.zip in repository root.'
            exit 1
          }

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _project
          unzip -q nomrenegar-project-2.1.0.zip -d _project
          test -f _project/nomrenegar/settings.gradle
          test -f _project/nomrenegar/app/build.gradle
          cp -a _project/nomrenegar/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nomrenegar-2.1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
