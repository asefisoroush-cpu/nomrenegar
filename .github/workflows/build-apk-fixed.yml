name: Build NomreNegar APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    # Pin the runner to Ubuntu 24.04 to avoid image migration surprises.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Find and extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zip_files=("$GITHUB_WORKSPACE"/*.zip)

          if [ "${#zip_files[@]}" -eq 0 ]; then
            echo "::error::No project ZIP found in the repository root."
            exit 1
          fi

          valid_archives=()
          for archive in "${zip_files[@]}"; do
            if unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)settings\.gradle$' \
              && unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)app/build\.gradle$'; then
              valid_archives+=("$archive")
            fi
          done

          if [ "${#valid_archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ZIP containing settings.gradle and app/build.gradle; found ${#valid_archives[@]}."
            printf 'ZIP: %s\n' "${zip_files[@]}"
            exit 1
          fi

          source_dir="$RUNNER_TEMP/nomrenegar_source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          unzip -q "${valid_archives[0]}" -d "$source_dir"

          settings_file="$(find "$source_dir" -type f -name settings.gradle -print -quit)"
          if [ -z "$settings_file" ]; then
            echo "::error::settings.gradle not found after extraction."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          required_files=(
            "build.gradle"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/example/nomrenegar/MainActivity.java"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$project_dir/$file" ]; then
              echo "::error::Missing required project file: $file"
              exit 1
            fi
          done

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Project extracted to: $project_dir"

      - name: Build debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK exists
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: nomrenegar-2.1.0-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
