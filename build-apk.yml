name: Build NomreNegar APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Find and extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zip_files=("$GITHUB_WORKSPACE"/*.zip)
          if [ "${#zip_files[@]}" -eq 0 ]; then
            echo "ERROR: Upload the NomreNegar project ZIP to the repository root."
            exit 1
          fi

          valid_archives=()
          for archive in "${zip_files[@]}"; do
            if unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)settings\.gradle$' \
              && unzip -Z1 "$archive" 2>/dev/null | grep -Eq '(^|/)app/build\.gradle$'; then
              valid_archives+=("$archive")
            fi
          done

          if [ "${#valid_archives[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one ZIP containing an Android Gradle project; found ${#valid_archives[@]}."
            echo "Keep only the new NomreNegar project ZIP in the repository root."
            printf 'ZIP found: %s\n' "${zip_files[@]}"
            exit 1
          fi

          archive="${valid_archives[0]}"
          echo "Using project archive: $(basename "$archive")"

          source_dir="$GITHUB_WORKSPACE/_nomrenegar_source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          unzip -q "$archive" -d "$source_dir"

          settings_file="$(find "$source_dir" -type f -name settings.gradle -print -quit)"
          if [ -z "$settings_file" ]; then
            echo "ERROR: settings.gradle was not found after extracting the ZIP."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          for required in build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/example/nomrenegar/MainActivity.java; do
            if [ ! -f "$project_dir/$required" ]; then
              echo "ERROR: Required project file is missing: $required"
              exit 1
            fi
          done

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Project root: $project_dir"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug
        working-directory: ${{ steps.extract.outputs.project_dir }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomrenegar-2.1.0-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
